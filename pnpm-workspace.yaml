packages:
  - "packages/*"
  - "apps/*"
  - "servers/*"

# Security floors for transitive dependencies the direct deps haven't picked up yet (pnpm audit,
# Nov 2026). Each stays inside the major the parent package already asks for. Drop an entry once
# the lockfile resolves past it on its own.
overrides:
  fast-uri@3: ^4.0.0
  ip-address@10: ^10.7.4
  qs@6: ^6.16.1
  body-parser@2: ^2.4.0
  proxy-addr@2: ^2.0.8
  '@hono/node-server@1': ^2.0.0
  undici@7: ^7.30.1
  sharp@0: ^0.35.5
  brace-expansion@5: ^5.0.12
  postcss@8: ^8.5.23
  nanoid@3: ^3.3.18
  source-map-js@1: ^1.2.2
  browserslist@4: ^4.28.7
  baseline-browser-mapping@2: ^2.11.0
