packages:
  - "packages/*"
  - "apps/*"
  - "servers/*"

# Security floors for transitive dependencies the direct deps haven't picked up yet (pnpm audit,
# Nov 2026). Each stays inside the major the parent package already asks for. Drop an entry once
# the lockfile resolves past it on its own.
overrides:
  fast-uri@3: ^3.1.9
  ip-address@10: ^10.7.4
  qs@6: ^6.16.1
  body-parser@2: ^2.4.0
  proxy-addr@2: ^2.0.8
  '@hono/node-server@1': ^2.0.0
  undici@7: ^7.30.1
  sharp@0: ^0.35.5
  brace-expansion@5: ^5.0.12
  postcss@8: ^8.5.23
  nanoid@3: ^3.3.18
  source-map-js@1: ^1.2.2
  browserslist@4: ^4.28.7
  baseline-browser-mapping@2: ^2.11.0

# Only resolve versions published at least 7 days ago (in minutes), matching Renovate's own 7-day
# wait. This also covers what Renovate does not: lock file maintenance, and the transitive
# dependencies a Renovate bump pulls in. A security fix younger than this needs a
# minimumReleaseAgeExclude entry (e.g. `- pkg@1.2.3`) until it ages; remove the entry afterwards.
minimumReleaseAge: 10080

# Dependency build scripts pnpm may run. Anything not listed stays blocked, and pnpm 11 and later fail the
# install on an undecided one (ERR_PNPM_IGNORED_BUILDS). esbuild and workerd use postinstall to check
# their platform binary. core-js-pure's postinstall only prints a funding message.
allowBuilds:
  esbuild: true
  workerd: true
  core-js-pure: false
